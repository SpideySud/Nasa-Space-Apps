<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Vitals Console: crew health analytics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Martian+Mono:wght@400;600&display=swap">
<style>

:root[data-theme="dark"]{--bg:#171B24;--pn:#212733;--hd:#1C212C;--ink:#CCCAC2;--mu:#8D949C;--ln:#333B4A;--ac:#FFAD66;--bl:#73D0FF;--g:#D5FF80;--w:#FFCC66;--b:#F28779;--sel:#2B3240;color-scheme:dark}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:grid;grid-template:"t t" 46px "n m" 1fr "s s" auto/176px 1fr;background:var(--bg);color:var(--ink);font:400 14.5px/1.45 "Hanken Grotesk",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
#top{grid-area:t;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--hd);border-bottom:1px solid var(--ln)}
.logo{font-weight:700;font-size:16px;margin-right:auto}.logo i{color:var(--ac);font-style:normal}
.pill,#top select{font:12px "Martian Mono",monospace;border:1px solid var(--ln);border-radius:6px;padding:3px 8px;background:var(--pn)}
#nav{grid-area:n;background:var(--hd);border-right:1px solid var(--ln);padding:10px 8px;display:flex;flex-direction:column;gap:2px}

#nav button:hover{background:var(--sel)}#nav button[aria-current=page]{background:var(--sel);color:var(--ac);font-weight:700;box-shadow:inset 3px 0 var(--ac)}
#main{grid-area:m;overflow:auto;padding:16px;background:radial-gradient(var(--ln) 1px,transparent 1.2px) 0 0/22px 22px}

@media(max-width:760px){body{grid-template:"t" auto "n" auto "m" 1fr "s" auto/1fr}#top{flex-wrap:wrap;padding:8px 12px}#nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln)}}
.pane{background:var(--pn);border:1px solid var(--ln);border-radius:8px;margin-bottom:14px;overflow:hidden}
.ph{background:var(--hd);border-bottom:1px solid var(--ln);padding:7px 12px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pb{padding:12px}.ph button{margin:0}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kp>div{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}.kp b{font:600 24px "Martian Mono",monospace;display:block}
.g2{display:grid;grid-template-columns:minmax(230px,290px) 1fr;gap:14px}@media(max-width:900px){.g2{grid-template-columns:1fr}}
.g3{display:grid;grid-template-columns:1fr minmax(240px,340px);gap:14px}@media(max-width:900px){.g3{grid-template-columns:1fr}}.kp b{color:var(--ink)}.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-weight:500;color:var(--mu);padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}tr[data-k]{cursor:pointer}tr.sel td{background:var(--sel)}
.mn{font-family:"Martian Mono",monospace;font-size:12.5px}.mu{color:var(--mu)}
.tg{display:inline-block;border:1px solid currentColor;border-radius:5px;padding:0 7px;font-size:12px;font-weight:500;margin:1px 0;color:var(--c)}
.s0{--c:var(--g)}.s1{--c:var(--w)}.s2{--c:var(--b)}.s9{--c:var(--mu)}
.c0{fill:var(--g)}.c1{fill:var(--w)}.c2{fill:var(--b)}.c9{fill:var(--mu)}
.mkr{cursor:pointer}.mkr .rg{fill:none;stroke-width:2;opacity:.5}.mkr.on .rg,.mkr:hover .rg{opacity:1;stroke-width:3}.mkr .rg.c0{stroke:var(--g)}.mkr .rg.c1{stroke:var(--w)}.mkr .rg.c2{stroke:var(--b)}.mkr .rg.c9{stroke:var(--mu)}
.bd{fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round}
.al{border-left:4px solid var(--c);padding:4px 0 4px 12px;margin:8px 0}.al b{color:var(--c)}
.btn{border:1px solid var(--ln);background:var(--pn);border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:500}.btn.p{background:var(--ac);border-color:var(--ac);color:#161A22}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 12px}label{font-size:12.5px;color:var(--mu);display:block}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg)}input:focus,select:focus,textarea:focus{border-color:var(--bl);outline:0}
textarea{font:12.5px/1.5 "Martian Mono",monospace;min-height:330px}
.q{display:flex;gap:8px;padding:2px 0}.q span{width:16px;color:var(--mu)}.q.ok,.q.ok span{color:var(--g)}button.q{background:none;border:0;width:100%;text-align:left;cursor:pointer;padding:6px 4px;border-radius:6px}button.q:hover{background:var(--sel)}.q.ok div{text-decoration:line-through;opacity:.7}
.bar,.tr{height:7px;border-radius:9px;background:var(--ln);position:relative;margin:6px 0}.bar i,.tr i{display:block;height:100%;border-radius:9px;background:var(--ac)}.tr b{position:absolute;top:-11px;transform:translateX(-50%)}
.bgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.bgs div{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;opacity:.55}.bgs div.on{opacity:1;border-color:var(--ac);background:var(--sel)}.bgs b{display:block}
#toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .3s}#toast.on{opacity:1}
@media(prefers-reduced-motion:no-preference){.boot>*{animation:in .5s both}.boot>*:nth-child(2){animation-delay:.1s}.boot>*:nth-child(3){animation-delay:.2s}.boot>*:nth-child(4){animation-delay:.3s}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style></head>
<body>
<header id="top"></header><nav id="nav" aria-label="Sections"></nav><main id="main"></main><footer id="sb"></footer><div id="toast" role="status"></div>
<script>
const M={
hr:{n:"Heart rate",u:"bpm",g:[50,90],lo:30,hi:130,s:1,d:64,how:"Rest seated 5 minutes. Use the camera button in Check-in, or count pulses at the wrist for 30 s and double it.",why:"Fluid shifts and lost fitness change resting heart rate. A climb can mean dehydration, deconditioning or infection.",t:"Hydrate, rest, and measure again in an hour."},
sys:{n:"Systolic BP",u:"mmHg",g:[90,129],lo:70,hi:170,s:1,d:118,how:"Sit upright, cuff at heart level on bare skin. Take two readings a minute apart.",why:"Microgravity moves fluid toward the head and unloads the heart. Low pressure after exercise is a risk too.",t:"Ease off salt, drink water, repeat at the same time tomorrow."},
dia:{n:"Diastolic BP",u:"mmHg",g:[60,84],lo:40,hi:110,s:1,d:76,how:"The same cuff reading gives both numbers.",why:"With systolic it shows how hard the heart works between beats.",t:"Rest, skip caffeine, repeat later."},
glu:{n:"Blood glucose",u:"mg/dL",g:[70,99],lo:50,hi:180,s:1,d:90,how:"Fasting reading: clean hands, prick the side of a fingertip, touch the strip to the drop.",why:"Stress, activity changes and limited food variety can swing blood sugar.",t:"More fiber and protein, fewer sugary snacks. Below 60: take 15 g fast carbohydrate and recheck."},
temp:{n:"Temperature",u:"°C",g:[36.1,37.5],lo:35,hi:39,s:.1,d:36.7,how:"Use the thermometer away from vents, not right after exercise.",why:"Heat sheds poorly in microgravity and shared air spreads infection. NASA also tracks immune changes in closed environments.",t:"Check cabin temperature and fluids, measure again in 30 minutes."},
sleep:{n:"Sleep",u:"h",g:[7,9.5],lo:3,hi:11,s:.1,d:7,how:"Enter hours slept last night from your log or wearable.",why:"Odd light cycles, noise and workload break circadian rhythm and dull judgment, mood and immunity.",t:"Dim lights an hour before bed and keep a fixed wake time."},
mood:{n:"Mood",u:"of 5",g:[4,5],lo:1,hi:5,s:1,d:4,how:"Rate how you feel right now, 1 very low to 5 great.",why:"Isolation and distance from Earth strain behavioral health, and mood often slips first.",t:"Call someone, share a meal with the crew, or spend a few minutes at the window."},
ex:{n:"Exercise",u:"min",g:[120,999],lo:0,hi:180,s:5,d:120,how:"Add up today’s resistance, treadmill and bike minutes.",why:"Without full gravity, bones and muscles unload. Daily loading is the main defense.",t:"Add a resistance session today."}};
const R={head:{t:"Brain",h:"Isolation and confinement",m:["sleep","mood"]},heart:{t:"Heart",h:"Gravity fields",m:["hr","sys","dia"]},gut:{t:"Metabolism",h:"Closed environments and distance",m:["glu"]},skin:{t:"Skin and core",h:"Hostile closed environments",m:["temp"]},legs:{t:"Bone and muscle",h:"Gravity fields",m:["ex"]}};
const PT={head:[[100,28]],heart:[[94,84]],gut:[[100,118]],skin:[[69,112]],legs:[[86,200],[114,200]]};
const E={leo:["Space station",1,"Near real-time link"],transit:["Deep-space transit",48,"Up to 24 min each way"],mars:["Mars base",48,"Up to 24 min each way"],moon:["Moon base",.05,"About 3 seconds each way"],rover:["Surface rover (Mars)",48,"Up to 24 min each way, and the link can drop"]};
const PS=[["Isolation strain",[["sleep",-1],["mood",-1]],"Contact a crewmate or behavioral health, and hold a fixed sleep schedule."],["Cardiovascular deconditioning",[["hr",1],["sys",1],["ex",-1]],"Add resistance and aerobic work, and increase fluids."],["Possible infection",[["temp",1],["hr",1]],"Limit contact with crewmates and report early."],["Metabolic stress",[["glu",1],["sleep",-1]],"Review your meal plan and protect sleep."]];
const K=Object.keys(M),W=["In range","Watch","Act now","No data"],CH=15.5;
let env="transit",sel="hr",view="td",en=[],cam=0,sent=0,note="",boot=1,rtv=0,Q={},tg={};
const $=i=>document.getElementById(i),f1=v=>+v.toFixed(1),sg=v=>(v>=0?"+":"")+v.toFixed(1);
const st=(k,v)=>{if(isNaN(v)||v==null)return 3;const[a,b]=M[k].g;if(v>=a&&v<=b)return 0;if(k=="mood")return v>=3?1:2;if(k=="ex")return v>=60?1:2;const d=.4*(b-a);return v>=a-d&&v<=b+d?1:2};
const sc=k=>{const s=st(k,last()[k]);return s==3?9:s};
function seed(){en=[];for(let i=1;i<=13;i++){const j=Math.max(i-7,0);en.push({hr:Math.round(63+j*1.8+Math.sin(i)*1.2),sys:Math.round(116+j*2.2+Math.cos(i)*1.5),dia:Math.round(74+j*1.2+Math.sin(i*3)),glu:Math.round(88+Math.sin(i*2)*2.5),temp:+(36.6+Math.sin(i)*.15).toFixed(1),sleep:+(7.5-j*.25+Math.abs(Math.sin(i))*.25).toFixed(1),mood:i>9?3:4,ex:Math.round(135-j*6+Math.sin(i)*5),rt:Math.round(246+j*10+Math.sin(i*2)*6)})}}
function load(){try{const s=localStorage.getItem("vc2");if(s){en=JSON.parse(s);return}}catch(e){}seed()}
function save(){try{localStorage.setItem("vc2",JSON.stringify(en))}catch(e){}}
const last=()=>en[en.length-1]||{};
function toast(t){const e=$("toast");e.textContent=t;e.className="on";setTimeout(()=>e.className="",2400)}
/* ---- lightweight ML, computed in the browser from the crew member’s own data ---- */
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length,sd=(a,m)=>Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/Math.max(a.length-1,1));
function ML(){const B=en.slice(0,Math.min(7,en.length)),o={};
 K.forEach(k=>{const b=B.map(e=>e[k]),mu=mean(b),s=Math.max(sd(b,mu),(M[k].hi-M[k].lo)*.02),v=en.map(e=>e[k]);let w=v[0];const ews=v.map(x=>(w=.3*x+.7*w));
  const n=Math.min(7,v.length),y=v.slice(-n),mx=(n-1)/2,my=mean(y);let sxx=0,sxy=0;y.forEach((yi,i)=>{sxx+=(i-mx)**2;sxy+=(i-mx)*(yi-my)});const sl=sxx?sxy/sxx:0,ic=my-sl*mx,res=Math.sqrt(y.reduce((q,yi,i)=>q+(yi-ic-sl*i)**2,0)/Math.max(n-2,1));
  o[k]={mu,sg:s,z:(v[v.length-1]-mu)/s,ez:(ews[ews.length-1]-mu)/s,ews,sl,ic,res,n,mx,sxx,nb:B.length}});return o}
const drift=(m,k)=>Math.abs(m[k].ez)>=2;
const d2s=m=>en.map(e=>K.reduce((s,k)=>s+((e[k]-m[k].mu)/m[k].sg)**2,0));
function ttt(m,k){const a=m[k],mm=M[k],cur=a.ic+a.sl*(a.n-1),thr=a.sl>0?mm.g[1]:mm.g[0];if(Math.abs(a.sl)*a.n<1.5*a.res||thr>900)return"No clear trend";const d=(thr-cur)/a.sl;return d<=0?"Past limit":d>30?"Stable (over 30 d)":"~"+Math.ceil(d)+" d to "+thr+" "+mm.u}
function pats(m){return PS.filter(p=>p[1].every(([k,d])=>d*m[k].ez>=1)).map(p=>({n:p[0],a:p[2],ks:p[1],c:1/(1+Math.exp(-(mean(p[1].map(([k,d])=>d*m[k].ez))-1.5)*1.6))}))}
function plan(m){const e=last(),L=["Rest 5 minutes, then measure again."];K.filter(k=>st(k,e[k])==2||(st(k,e[k])==1&&drift(m,k))).forEach(k=>L.push(M[k].n+": "+M[k].t));pats(m).forEach(p=>L.push(p.n+": "+p.a));L.push("Write what you did in the notes box so the report stays current.");return[...new Set(L)]}
/* ---- extra models: next-day risk, change-point onset, personal drivers, reaction test ---- */
const erf=x=>{const t=1/(1+.3275911*Math.abs(x)),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y},Phi=z=>.5*(1+erf(z/Math.SQRT2)),sn=v=>(v>=0?"+":"")+v.toFixed(Math.abs(v)<1?2:1);
const pane=(t,b)=>`<section class="pane"><div class="ph">${t}</div><div class="pb">${b}</div></section>`,rts=()=>en.map(e=>e.rt).filter(v=>v!=null);
function risk(m){return K.map(k=>{const a=m[k],g=M[k].g,x=a.n,mu=a.ic+a.sl*x,s=Math.max(a.res*Math.sqrt(1+1/a.n+(x-a.mx)**2/(a.sxx||1)),a.sg*.5),ub=k=="mood"?99:g[1];return{k,p:Math.min(Phi((g[0]-mu)/s)+1-Phi((ub-mu)/s),.99)}}).sort((a,b)=>b.p-a.p)}
function onset(m){const n=en.length,o=[];if(n<8)return o;K.forEach(k=>{const v=en.map(e=>e[k]);let b=null;for(let i=3;i<=n-3;i++){const A=v.slice(0,i),B=v.slice(i),ma=mean(A),mb=mean(B),s=A.reduce((q,x)=>q+(x-ma)**2,0)+B.reduce((q,x)=>q+(x-mb)**2,0);if(!b||s<b.s)b={s,i,z:(mb-ma)/m[k].sg}}if(b&&Math.abs(b.z)>=1.5)o.push({k,d:b.i+1,z:b.z})});return o.sort((a,b)=>a.d-b.d||Math.abs(b.z)-Math.abs(a.z))}
function drivers(){const n=en.length,o=[];if(n<9)return o;[["sleep",1,"extra hour of sleep"],["ex",30,"extra 30 min of exercise"]].forEach(([x,u,w])=>["hr","sys","dia","temp","mood","glu"].forEach(y=>{const X=en.slice(0,-1).map(e=>e[x]),Y=en.slice(1).map(e=>e[y]),mx=mean(X),my=mean(Y);let sxx=0,sxy=0,syy=0;X.forEach((xi,i)=>{sxx+=(xi-mx)**2;sxy+=(xi-mx)*(Y[i]-my);syy+=(Y[i]-my)**2});const r=sxy/Math.sqrt(sxx*syy||1);if(Math.abs(r)>=.55)o.push({y,r,b:sxy/(sxx||1)*u,w,n:X.length})}));return o.sort((a,b)=>Math.abs(b.r)-Math.abs(a.r)).slice(0,4)}
function anPanes(m){const rk=risk(m).slice(0,4),on=onset(m),dr=drivers();
 return pane("Tomorrow’s risk",rk.map(r=>`<div>${M[r.k].n}: <b class="mn">${Math.round(r.p*100)}%</b> chance of leaving the standard range<div class="bar"><i style="width:${r.p*100}%"></i></div></div>`).join("")+`<p class="mu">Predictive distribution from each indicator’s 7-day trend and its own scatter (normal approximation). Not clinical.</p>`)
 +pane("When did it start?",on.length?on.map(o=>`<div class="al s1"><b>${M[o.k].n}</b> shifted ${sn(o.z)}σ starting day ${o.d}</div>`).join("")+`<p class="mu">Change-point detection: the best two-segment fit for each indicator. The earliest shift is the best lead to follow up.</p>`:`<p class="mu">No sustained shift detected yet. Needs 8 or more days.</p>`)
 +pane("Your personal drivers",dr.length?dr.map(d=>`<div class="al s9"><b>${M[d.y].n}</b> ${sn(d.b)} ${M[d.y].u} the next day per ${d.w} <span class="mu">(r ${sn(d.r)}, ${d.n} day pairs)</span></div>`).join("")+`<p class="mu">Lag-1 associations in this crew member’s own data. They suggest what to try, not proof of cause.</p>`:`<p class="mu">No clear links yet. Needs 9 or more days.</p>`)}
function rtPane(){const h=rts(),b=h.slice(0,7);let s="";if(b.length>=3){const mu=mean(b),s2=Math.max(sd(b,mu),5);s=`Your baseline ${Math.round(mu)}±${Math.round(s2)} ms. Last result ${h[h.length-1]} ms (${sn((h[h.length-1]-mu)/s2)}σ).`}
 return pane("Reaction test (alertness)",`<p>Five quick taps. Space agencies use short reaction-time tests as a fatigue check, because slower reactions follow short sleep and risky tasks need a sharp crew member.</p><button class="btn p" type="button" id="rts">Start test</button><div id="rtb" role="button" tabindex="0" style="margin-top:10px;height:130px;border-radius:10px;display:none;align-items:center;justify-content:center;font:600 22px 'Martian Mono',monospace;user-select:none;cursor:pointer;touch-action:manipulation"></div><p class="mn" id="rtm">${s}</p>`)}
function runRt(){const b=$("rtb"),o=$("rtm"),rs=[];let stage=0,t0=0,tm;b.style.display="flex";
 const col=(c,t,f)=>{b.style.background=c;b.style.color=f||"#161A22";b.textContent=t};
 function trial(){stage=1;col("#E8A33A","Wait for green…");tm=setTimeout(()=>{stage=2;t0=performance.now();col("#4FB36B","TAP!")},1200+Math.random()*2500)}
 b.onpointerdown=ev=>{ev.preventDefault();if(stage==1){clearTimeout(tm);o.textContent="Too early. Wait for green.";trial()}else if(stage==2){const t=Math.round(performance.now()-t0);rs.push(t);if(rs.length<5){o.textContent="Trial "+rs.length+": "+t+" ms";trial()}else{stage=0;rtv=[...rs].sort((x,y)=>x-y)[2];col("var(--hd)","Median "+rtv+" ms","var(--ink)");o.textContent="Median "+rtv+" ms. It will be saved with today’s check-in."}}};
 b.onkeydown=ev=>{if(ev.key==" "||ev.key=="Enter")b.onpointerdown(ev)};trial()}
function mnotes(m){const on=onset(m),rk=risk(m)[0],h=rts(),x=[];if(on.length)x.push("Earliest shift: "+on.slice(0,3).map(o=>M[o.k].n+" from day "+o.d+" ("+sn(o.z)+"σ)").join("; "));if(rk&&rk.p>=.2)x.push("Highest next-day risk: "+M[rk.k].n+" "+Math.round(rk.p*100)+"%");if(h.length)x.push("Reaction test "+h[h.length-1]+" ms");return x.length?"\nModel notes: "+x.join(". ")+".":""}
function rep(m){const e=last(),bad=K.filter(k=>st(k,e[k])==2),fl=K.filter(k=>st(k,e[k])>0||drift(m,k)),pt=pats(m),d=d2s(m).pop(),ln=k=>`- ${M[k].n}: ${e[k]} ${M[k].u} (own baseline ${f1(m[k].mu)}±${f1(m[k].sg)}, ${sg(m[k].ez)}σ; ${ttt(m,k)})`;
 return["S: Day "+en.length+", "+E[env][0]+". "+(bad.length?"Out of range: "+bad.map(k=>M[k].n).join(", ")+".":"No reading is out of the population range.")+(K.some(k=>drift(m,k))?" Drift from personal baseline: "+K.filter(k=>drift(m,k)).map(k=>M[k].n).join(", ")+".":""),"","B: Personal baseline = days 1 to "+m.hr.nb+" of this crew member. Pulse measured by camera: "+(en.some(x=>x.cam)?"yes":"no")+".","","A: Flagged readings:",...(fl.length?fl.map(ln):["- none"]),"Pattern checks: "+(pt.length?pt.map(p=>p.n+" ("+Math.round(p.c*100)+"% confidence)").join("; "):"none active")+".","Anomaly score "+d.toFixed(1)+" (limit "+CH+")."+mnotes(m),"","R: Actions taken or planned:",...plan(m).map(x=>"- "+x),note?"Crew notes: "+note:"","Request: confirm assessment and advise. Reply may take "+rtt(E[env][1])+" round trip, so next steps above proceed unless told otherwise."].join("\n")}

function vAn(m){const a=m[sel],pt=pats(m);return`${pane('How to read this page in plain words',`<p><b>Your usual:</b> the average of your first week, so the app knows what is normal for you.</p><p><b>σ (sigma):</b> how far today is from your usual. About 1 is a small difference, 2 or more is clearly different.</p><p><b>Drift:</b> a number slowly moving away from your usual, even while it is still in the normal range.</p><p><b>Forecast and tomorrow’s risk:</b> where a number is heading, and how likely it is to leave normal tomorrow, if the recent trend continues.</p><p><b>Overall unusualness score:</b> one number for the whole day. Above the limit means the day is unusual overall.</p>`)}<section class="pane"><div class="ph">Personal baseline, trend and forecast</div><div class="pb"><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${K.map(k=>`<button class="btn ${k==sel?"p":""}" data-k="${k}">${M[k].n}</button>`).join("")}</div>${chart(sel,m)}<p class="mu">Blue band: your normal (mean ± 2σ, first ${a.nb} days). Black line: smoothed (EWMA, α 0.3). Orange dashed: 7-day linear forecast with 95% band.</p><p class="mn">slope ${sg(a.sl)} ${M[sel].u}/day · residual σ ${f1(a.res)} · smoothed z ${sg(a.ez)} · ${ttt(m,sel)}</p></div></section>
 <section class="pane"><div class="ph">Multivariate anomaly score</div><div class="pb">${d2chart(m)}<p class="mu">Sum of squared z-scores across all 8 indicators (diagonal Mahalanobis distance). Above ${CH}, the day is unusual for you overall (χ² 95%, 8 degrees of freedom).</p></div></section>
 <section class="pane"><div class="ph">Cross-indicator patterns</div><div class="pb">${PS.map(p=>{const q=pt.find(x=>x.n==p[0]);return`<div class="al ${q?"s1":"s9"}"><b>${p[0]}</b> ${q?Math.round(q.c*100)+"% confidence":"not active"}<br><span class="mu">Fires when ${p[1].map(([k,d])=>M[k].n.toLowerCase()+(d>0?" rises":" falls")).join(" and ")} beyond 1σ from baseline. ${q?q.a:""}</span></div>`}).join("")}</div></section>
 ${anPanes(m)}
 <p class="mu">These are lightweight statistical models fitted in your browser to this crew member’s own entries. They are not trained or validated on clinical data. A production version would learn from pre-flight baselines and flight surgeon feedback.</p>`}
function vRp(m){const r=E[env][1],tm=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});return`<div class="g3"><section class="pane"><div class="ph">One-message report for the flight surgeon <button class="btn" data-a="copy">Copy</button></div><div class="pb"><label for="nt">Your notes (added to the report)</label><input id="nt" value="${note.replace(/"/g,"&quot;")}"><textarea id="rp" style="margin-top:8px">${rep(m)}</textarea></div></section>
 <div><section class="pane"><div class="ph">Delay clock</div><div class="pb">${sent?`<p>Sent at ${tm(sent)}.</p><p class="mn" style="font-size:22px" id="cd"></p><p class="mu">Keep following the plan until a reply arrives.</p>`:`<p>Round trip: ${rtt(r)} (${E[env][2]}). If you send now, the earliest reply is about ${tm(Date.now()+r*60000)}.</p><button class="btn p" data-a="sent">Mark as sent</button>`}</div></section>
 ${wpane(m)}</div></div>`}
function vCr(m){const x=xpOf(en),r=rank(x),tot={leo:180,transit:210,mars:500,moon:180,rover:30}[env],d=en.length,pc=Math.min(d/tot*100,100);let sk=0;for(let i=en.length-1;i>=0&&!K.some(k=>st(k,en[i][k])==2);i--)sk++;
 return`<div class="kp"><div class="mu">Rank<b>${r.n}</b><div class="bar"><i style="width:${r.nx?(x-r.f)/(r.nx-r.f)*100:100}%"></i></div>${x} XP${r.nx?", "+(r.nx-x)+" to "+r.nn:""}</div><div class="mu">Steady streak<b>${sk} d</b>days in a row with no red reading</div><div class="mu">Mission day<b>${d}/${tot}</b><div class="tr"><i style="width:${pc}%"></i><b style="left:${pc}%" aria-hidden="true">🚀</b></div></div></div>
 <section class="pane"><div class="ph">Badges</div><div class="pb bgs">${[["Iron Bones","120+ min exercise, 3 days",run(["ex"],3)],["Night Watch","7+ h sleep, 3 days",run(["sleep"],3)],["Steady Heart","Heart rate and BP in range, 5 days",run(["hr","sys","dia"],5)],["Bright Mind","Mood 4+, 5 days",run(["mood"],5)],["Sweet Balance","Glucose in range, 5 days",run(["glu"],5)],["Lens Pulse","Read pulse by camera",en.some(e=>e.cam)]].map(b=>`<div class="${b[2]?"on":""}"><b>${b[0]}</b>${b[1]}<br><span class="mu">${b[2]?"Earned":"Locked"}</span></div>`).join("")}</div></section>
 ${qpane()}`}
function preview(){const m=ML(),e={};K.forEach(k=>e[k]=parseFloat($("i_"+k).value));e.cam=cam;const d=K.reduce((s,k)=>s+((e[k]-m[k].mu)/m[k].sg)**2,0);
 $("pv").innerHTML=`<b class="mn" style="font-size:26px;color:${d>CH?"var(--b)":"var(--g)"}">${isNaN(d)?"–":d.toFixed(1)}</b><div class="mu">Entry anomaly score vs your baseline. Limit ${CH}.</div><p>${K.map(k=>{const z=(e[k]-m[k].mu)/m[k].sg;return`<span class="tg s${Math.abs(z)>=2?1:0}">${M[k].n} ${sg(z)}σ</span>`}).join(" ")}</p><p class="mu">Quests (10 XP each)</p>${qhtml(qd(e))}`}
function render(){const m=ML();
 $("top").innerHTML=`<span class="logo"><i>◉</i> Vitals Console</span><select id="envs" aria-label="Environment">${Object.keys(E).map(k=>`<option value="${k}" ${k==env?"selected":""}>${E[k][0]}</option>`).join("")}</select><span class="pill">Day ${en.length}</span><span class="pill">RTT ${rtt(E[env][1])}</span>`;
 $("nav").innerHTML=[["td","Today"],["ov","Overview"],["ci","Check-in"],["an","Analytics (advanced)"],["rp","Report"],["cr","Crew"]].map(v=>`<button data-v="${v[0]}" ${v[0]==view?'aria-current="page"':""}>${v[1]}</button>`).join("");
 $("main").innerHTML={td:vTd,ov:vOv,ci:vCi,an:vAn,rp:vRp,cr:vCr}[view](m);$("main").className=boot?"boot":"";boot=0;
 $("sb").innerHTML=`<span>Baseline model: ${m.hr.nb} samples</span><span>EWMA α0.3 · 7-day OLS · anomaly limit ${CH}</span><span>${E[env][2]}</span><span>Local only: no data leaves this device</span>`;
 if(view=="ci")preview()}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-v],[data-k],[data-r],[data-a]");if(!t)return;const d=t.dataset;if(d.v)view=d.v;if(d.k)sel=d.k;if(d.r)sel=R[d.r].m[0];
 const q0=qn();if(d.a=="sent")sent=Date.now();if(d.a=="tg")tg[d.i]=!tg[d.i];if(d.a=="qx")Q.ex=Math.min((Q.ex||0)+ +d.n,300);if(d.a=="qr")Q.ex=0;if(d.a=="qs")Q.sleep=+d.n;if(d.a=="qm")Q.mood=+d.n;if(qn()>q0)toast("Quest complete! +10 XP when you save your check-in");if(d.a=="copy"){const r=$("rp");r.select();try{navigator.clipboard.writeText(r.value)}catch(e){}toast("Report copied");return}render()});
document.addEventListener("keydown",ev=>{const t=ev.target;if((ev.key=="Enter"||ev.key==" ")&&t.dataset&&t.dataset.r){ev.preventDefault();sel=R[t.dataset.r].m[0];render()}});
document.addEventListener("change",ev=>{if(ev.target.id=="envs"){env=ev.target.value;render()}});
document.addEventListener("input",ev=>{if(ev.target.closest("#f"))preview();if(ev.target.id=="nt"){note=ev.target.value;$("rp").value=rep(ML())}});
document.addEventListener("submit",ev=>{if(ev.target.id!="f")return;ev.preventDefault();const o={};for(const k of K){const v=parseFloat($("i_"+k).value);if(isNaN(v)){toast("Enter a number for "+M[k].n);return}o[k]=v}
 const x0=xpOf(en),r0=rank(x0).i;if(cam)o.cam=1;cam=0;if(rtv)o.rt=rtv;rtv=0;en.push(o);save();Q={};tg={};const x1=xpOf(en);view="td";render();toast(rank(x1).i>r0?"Rank up: "+rank(x1).n:"Day "+en.length+" saved, +"+(x1-x0)+" XP")});
setInterval(()=>{const c=$("cd");if(c&&sent){const r=sent+E[env][1]*60000-Date.now();c.textContent=r>0?Math.floor(r/60000)+" min "+String(Math.floor(r%60000/1000)).padStart(2,"0")+" s":"Reply window open"}},1000);
/* ---- camera pulse (image input) ---- */
function bpm(T,V){const n=V.length;if(n<90)return 0;const sm=V.map((_,i)=>{let a=0,c=0;for(let j=i-2;j<=i+2;j++)if(V[j]!=null){a+=V[j];c++}return a/c}),bl=sm.map((_,i)=>{let a=0,c=0;for(let j=i-15;j<=i+15;j++)if(sm[j]!=null){a+=sm[j];c++}return a/c}),h=sm.map((v,i)=>v-bl[i]),s=Math.sqrt(h.reduce((a,v)=>a+v*v,0)/n),p=[];
 for(let i=1;i<n-1;i++)if(h[i]>s*.5&&h[i]>=h[i-1]&&h[i]>h[i+1]&&(!p.length||T[i]-T[p[p.length-1]]>380))p.push(i);
 if(p.length<8)return 0;const iv=[];for(let i=1;i<p.length;i++)iv.push(T[p[i]]-T[p[i-1]]);iv.sort((a,b)=>a-b);return Math.round(60000/iv[iv.length>>1])}
async function pulse(){const o=$("pm"),b=$("pb");let s;
 try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:64,height:64}})}catch(e){o.textContent="Camera not available here. Type your pulse, or open this page in its own tab and allow camera access.";return}
 try{await s.getVideoTracks()[0].applyConstraints({advanced:[{torch:true}]})}catch(e){}
 const v=document.createElement("video");v.srcObject=s;v.muted=true;v.playsInline=true;await v.play();const c=document.createElement("canvas");c.width=c.height=24;const x=c.getContext("2d",{willReadFrequently:true});let T=[],V=[],t0=performance.now();const dur=15000;b.disabled=true;
 (function loop(){const t=performance.now()-t0;x.drawImage(v,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let r=0,g=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1]}r/=576;g/=576;
  if(r<70||g>r*.6){T=[];V=[];t0=performance.now();o.textContent="Cover the lens and flash fully with a fingertip and hold still."}else{T.push(t);V.push(r);o.textContent="Hold still… "+Math.ceil((dur-t)/1000)+" s"}
  if(t<dur)requestAnimationFrame(loop);else{s.getTracks().forEach(k=>k.stop());b.disabled=false;const q=bpm(T,V);if(q>35&&q<200){$("i_hr").value=q;cam=1;o.textContent="Pulse "+q+" bpm from 15 s of video. Filled in above.";preview()}else o.textContent="No clean pulse found. Cover lens and flash, press lightly, try again."}})()}
document.addEventListener("click",ev=>{if(ev.target.id=="pb")pulse();if(ev.target.id=="rts")runRt()});
load();render();
</script></body></html>
